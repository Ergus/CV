name: Build LaTeX CV
on: [push]

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: pdflatex CV
        uses: dante-ev/latex-action@latest
        with:
          root_file: CV.tex
          compiler: lualatex
          args: -interaction=nonstopmode -shell-escape

      - name: biber CV
        uses: dante-ev/latex-action@latest
        with:
          root_file: CV
          compiler: biber
          args:

      - name: pdflatex CV
        uses: dante-ev/latex-action@latest
        with:
          root_file: CV.tex
          compiler: lualatex
          args: -interaction=nonstopmode -shell-escape

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CV
          path: CV.pdf
